# fly.toml app configuration file generated for wc-api on 2026-06-12T09:21:11-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wc-api'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'

[[mounts]]
  source = 'wc_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
